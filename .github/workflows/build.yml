name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip project
        run: unzip -o bangla_book_library_m1.zip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Create Android project files
        working-directory: m1
        run: flutter create --platforms=android --org com.example --project-name bangla_book_library .
      - name: Get packages
        working-directory: m1
        run: flutter pub get
      - name: Set app name
        working-directory: m1
        run: sed -i 's/android:label="[^"]*"/android:label="BoiVerse"/' android/app/src/main/AndroidManifest.xml
      - name: Set app icon
        working-directory: m1
        run: dart run flutter_launcher_icons
      - name: Build APK
        working-directory: m1
        run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: bangla-book-library-apk
          path: m1/build/app/outputs/flutter-apk/app-release.apk
